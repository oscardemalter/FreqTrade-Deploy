version: "3.8"

services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
    privileged: false
    network_mode: bridge
    environment:
      - FQDN=freqtrade
    command: >
      bash -c "sleep 3 && freqtrade --version && tail -f /dev/null"
    ports:
      - "127.0.0.1:8080:8080" # FreqUI (bind to localhost for SSH tunneling)

# Optional: add other services here (nginx reverse proxy, db, etc.)
